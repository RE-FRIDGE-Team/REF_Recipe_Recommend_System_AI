# 유튜브 레시피 크롤러 compose
#
# 기존 ML 파이프라인 compose(docker-compose.yml)와 분리함.
# 이유: 베이스 이미지·파이썬 버전이 다르고, 크롤러는 1회성 실행 잡이라
#       상시 띄우는 개발 컨테이너와 수명주기가 다름.
#
# 실행 위치는 repo 루트 (빌드 컨텍스트가 루트여야 COPY 경로가 맞음):
#   docker compose -f recipe_crawler_model/docker-compose.crawler.yml build
#   docker compose -f recipe_crawler_model/docker-compose.crawler.yml run --rm crawler --no-asr --limit 5
#
# API 키는 repo 루트의 .env 에 넣어둘 것 (git 제외 대상):
#   YOUTUBE_API_KEY=발급받은키

services:
  # ── CPU 실행 (기본) ────────────────────────────────────────────
  crawler:
    build:
      context: ..                                   # repo 루트가 컨텍스트
      dockerfile: recipe_crawler_model/Dockerfile
    image: ref-recipe-crawler:cpu
    env_file:
      - ../.env                                     # YOUTUBE_API_KEY 주입
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # 최종 CSV — 호스트에서 바로 확인 가능하게 바인드 마운트
      - ../recipe_data_collection:/workspace/recipe_data_collection
      # 체크포인트/음성 임시파일 — 중단 후 재실행 시 이어서 처리하려면 유지 필요
      - crawler-data:/workspace/recipe_crawler_model/data
      # whisper 모델 캐시 — 없으면 컨테이너 띄울 때마다 수 GB 재다운로드
      - whisper-cache:/cache/huggingface
    working_dir: /workspace

  # ── GPU 실행 ──────────────────────────────────────────────────
  # nvidia-container-toolkit 필요.
  #   docker compose -f ... --profile gpu run --rm crawler-gpu --limit 20
  crawler-gpu:
    build:
      context: ..
      dockerfile: recipe_crawler_model/Dockerfile.gpu
    image: ref-recipe-crawler:gpu
    profiles: ["gpu"]                               # 기본 실행에서 제외
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../recipe_data_collection:/workspace/recipe_data_collection
      - crawler-data:/workspace/recipe_crawler_model/data
      - whisper-cache:/cache/huggingface
    working_dir: /workspace

volumes:
  crawler-data:      # 체크포인트(JSONL) + 임시 음성
  whisper-cache:     # faster-whisper 모델 가중치
